<!-- add_toddler.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Toddler</title>
</head>
<body>
    <h2>Add a New Toddler</h2>
    <form method="POST" id="add-toddler-form">
        {% csrf_token %}
        <div>
            <label for="first_name">First Name:</label>
            <input type="text" name="first_name" required>
        </div>
        <div>
            <label for="last_name">Last Name:</label>
            <input type="text" name="last_name" required>
        </div>
        <div>
            <label for="ic_number">IC Number:</label>
            <input type="text" name="ic_number" required>
        </div>
        <div>
            <label for="contact_number">Contact Number:</label>
            <input type="text" name="contact_number" required>
        </div>
        <div>
            <label for="address">Address:</label>
            <textarea name="address" required></textarea>
        </div>
        <div>
            <label for="age">Age:</label>
            <input type="number" name="age" required>
        </div>
        <div>
            <label for="gender">Gender:</label>
            <select name="gender" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>
        <button type="submit">Add Toddler</button>
    </form>

    <div id="response-message"></div>

    <script>
        document.getElementById("add-toddler-form").addEventListener("submit", function(e) {
            e.preventDefault();  // Prevent default form submission

            var formData = new FormData(this);  // Create a FormData object with form data

            fetch("{% url 'add_toddler' %}", {
                method: "POST",
                body: formData,
                headers: {
                    "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value  // Ensure CSRF token is included
                }
            })
            .then(response => response.json())
            .then(data => {
                var responseMessage = document.getElementById("response-message");
                if (data.success) {
                    responseMessage.innerHTML = "<p>" + data.message + "</p>";
                } else {
                    responseMessage.innerHTML = "<p style='color: red;'>" + data.error + "</p>";
                }
            })
            .catch(error => {
                var responseMessage = document.getElementById("response-message");
                responseMessage.innerHTML = "<p style='color: red;'>There was an error with your request.</p>";
            });
        });
    </script>
</body>
</html>
