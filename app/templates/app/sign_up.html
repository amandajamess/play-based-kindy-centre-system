<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Sign Up</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <!-- Main User Registration Form -->
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Next</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'login' %}">Already have an account? Log in</a>
                </div>
            </div>
        </div>
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <!-- Role-Specific Additional Form -->
                {% if role_form %}
                    <h2 class="text-center">Additional Information</h2>
                    <form method="post">
                        {% csrf_token %}
                        {{ role_form.as_p }}
                        <button type="submit" class="btn btn-success w-100 mt-3">Complete Registration</button>
                    </form>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
