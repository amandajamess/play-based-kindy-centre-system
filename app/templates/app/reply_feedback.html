<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reply to Feedback</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            max-width: 600px;
            margin: auto;
            border-radius: 10px;
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #007bff, #0056b3);
        }
        .btn-success {
            background-color: #28a745;
            border: none;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .btn-secondary {
            background-color: #6c757d;
            border: none;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        textarea {
            height: 120px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header text-white text-center py-3">
                <h4 class="mb-0">Reply to Feedback</h4>
            </div>
            <div class="card-body">
                <p class="fw-bold">Message:</p>
                <p class="border p-3 bg-light">{{ feedback.message }}</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="reply_message" class="fw-bold">Your Reply:</label>
                        <textarea name="reply_message" class="form-control" required></textarea>
                    </div>
                    <div class="mt-4 d-flex justify-content-between">
                        <a href="{% url 'admin_dashboard' %}?section=feedback" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">Send Reply</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
