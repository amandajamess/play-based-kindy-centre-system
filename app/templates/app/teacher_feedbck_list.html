<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Feedback List</title>
    <!-- You can add your Bootstrap CSS link here if necessary -->
    <!-- <link rel="stylesheet" href="path/to/bootstrap.css"> -->
</head>
<body>
    <h1>Feedback List</h1>

    <table class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>Toddler</th>
                <th>Recipient</th>
                <th>Message</th>
                <th>Submitted At</th>
            </tr>
        </thead>
        <tbody>
            {% for feedback in feedback_list %}
                <tr>
                    <td>{{ feedback.toddler.full_name }}</td>
                    <td>{{ feedback.recipient }}</td>
                    <td>{{ feedback.message }}</td>
                    <td>{{ feedback.submitted_at|date:"M d, Y, h:i A" }}</td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="4">No feedback available.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
