<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Schedule</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h4>Create a Schedule</h4>
        
        <!-- Check if toddlers are available -->
        {% if toddlers %}
            <form id="choose-schedule-form" method="POST" action="{% url 'choose_schedule' %}">
                {% csrf_token %}
                
                <!-- Select Registered Toddler -->
                <div class="mb-3">
                    <label for="toddler_full_name" class="form-label">Select Toddler</label>
                    <select name="toddler_full_name" class="form-control" id="toddler_full_name" required>
                        <option value="">Select Toddler</option> <!-- Default option -->
                        {% for toddler in toddlers %}
                            <option value="{{ toddler.full_name }}">{{ toddler.full_name }}</option>
                                
                        {% endfor %}
                    </select>
                </div>

                <!-- Date Input -->
                <div class="mb-3">
                    <label for="date" class="form-label">Select Date</label>
                    <input type="date" class="form-control" id="date" name="date" required>
                </div>

                <!-- Start Time -->
                <div class="mb-3">
                    <label for="start_time" class="form-label">Start Time</label>
                    <input type="time" class="form-control" id="start_time" name="start_time" required>
                </div>

                <!-- End Time -->
                <div class="mb-3">
                    <label for="end_time" class="form-label">End Time</label>
                    <input type="time" class="form-control" id="end_time" name="end_time" required>
                </div>

                <!-- Activity Name -->
                <div class="mb-3">
                    <label for="activity_name" class="form-label">Activity Name</label>
                    <input type="text" class="form-control" id="activity_name" name="activity_name" placeholder="Enter Activity Name" required>
                </div>
                
                <button type="submit" class="btn btn-dark">Submit</button>
            </form>

            <!-- Show the result of the submission -->
            <div id="schedule-result" class="mt-3"></div>

        {% else %}
            <p>No toddlers found. Please add a toddler first.</p>
        {% endif %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

    <!-- Optional: JS for form submission handling (AJAX) -->
    <script>
        document.getElementById("choose-schedule-form").addEventListener("submit", function(e) {
            e.preventDefault();

            const formData = new FormData(this);

            fetch("{% url 'choose_schedule' %}", {
                method: "POST",
                body: formData,
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById("schedule-result").innerHTML = `<div class="alert alert-success">Schedule created successfully!</div>`;
                    document.getElementById('choose-schedule-form').reset();
                } else {
                    document.getElementById("schedule-result").innerHTML = `<div class="alert alert-danger">Failed to create schedule. Please try again.</div>`;
                }
            })
            .catch(error => {
                document.getElementById("schedule-result").innerHTML = `<div class="alert alert-danger">Error: ${error}</div>`;
            });
        });
    </script>
</body>
</html>
